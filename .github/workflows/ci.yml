name: Tensorbox CI/CD & Dependency Automation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run automated dependency health check every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Automated Tests & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<76" wheel
          pip install pytest pytest-asyncio
          pip install -r requirements.in

      - name: Run Dependency Conflict Check
        run: |
          python scripts/check_dependencies.py

      - name: Run Test Suite
        run: |
          pytest tests

  docker-build:
    name: 🐳 Docker Build & Container Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tensorbox:test

      - name: Test Container Startup & Health
        run: |
          docker run -d --name test-container -p 8080:8080 -p 8888:8888 tensorbox:test
          sleep 5
          docker exec test-container tensorbox status
          docker stop test-container

      - name: Log in to Docker Hub (On Release Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image (On Release Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tensorbox:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tensorbox:${{ github.ref_name }}
