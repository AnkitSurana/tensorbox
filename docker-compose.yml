services:
  tensorbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: tensorbox:latest
    container_name: tensorbox
    ports:
      - "8080:8080"
      - "8888:8888"
      - "8501:8501"
      - "5000:5000"
      - "6006:6006"
      - "8000:8000"
      - "5432:5432"
      - "6379:6379"
    volumes:
      - ./:/workspace
      - ./logs:/workspace/logs
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      - ml-network
    stdin_open: true
    tty: true

  # Vector Databases
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - CHROMA_DB_IMPL=duckdb+parquet
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=false
    networks:
      - ml-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    profiles: ["full", "vectordb"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: qdrant-secret-key
    networks:
      - ml-network

  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: weaviate
    profiles: ["full", "vectordb"]
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - ./weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
    networks:
      - ml-network

  milvus:
    image: milvusdb/milvus:latest
    container_name: milvus
    profiles: ["full", "vectordb"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./milvus_data:/var/lib/milvus
    environment:
      COMMON_STORAGETYPE: local
    networks:
      - ml-network

  # Relational & NoSQL Databases
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    profiles: ["full", "databases"]
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ml_database}
    networks:
      - ml-network

  mongodb:
    image: mongo:7
    container_name: mongodb
    profiles: ["full", "databases"]
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
      - ./mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    networks:
      - ml-network

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["full", "databases"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis-password}
    networks:
      - ml-network

  # Admin Panels
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    profiles: ["full", "admin"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    networks:
      - ml-network
    depends_on:
      - postgres

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    profiles: ["full", "admin"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-admin}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017/
    networks:
      - ml-network
    depends_on:
      - mongodb

networks:
  ml-network:
    driver: bridge
